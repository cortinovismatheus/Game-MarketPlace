services:
  mysql:
    image: mysql:8.0
    container_name: gameMarketplace-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: gameMarketplace
      MYSQL_PASSWORD: 12345678

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
